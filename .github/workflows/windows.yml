name: Windows portable build
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Build, test, bundle dependencies, and test frozen worker
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Accessibility-Prep-windows-x64
          path: dist/
          if-no-files-found: error
      - name: Upload verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification
          path: |
            build/test-results.xml
            build/packaged-self-test.json
            resources/build-manifest.json
            resources/python-dependencies.json
